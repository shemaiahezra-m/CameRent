<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Login</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial;padding:24px}
    form{max-width:360px;margin-top:20px}
    input{width:100%;padding:10px;margin:8px 0;border:1px solid #e5e7eb;border-radius:6px}
    button{padding:10px 14px;border-radius:6px;border:none;background:#7c3aed;color:white;cursor:pointer}
  </style>
</head>
<body>
  <h1>Admin Login</h1>
  <form id="login" method="post">
    <input type="email" name="email" placeholder="Admin email" required />
    <input type="password" name="password" placeholder="Password" required />
    <input type="hidden" name="next" value="" />
    <input type="hidden" name="csrf" id="csrfInput" value="">
    <div style="margin-top:8px"><button>Sign in</button></div>
  </form>
  <script>
    const params = new URLSearchParams(window.location.search);
    const next = params.get('next') || '/admin/users';
    document.querySelector('input[name="next"]').value = next;

    // if server rendered a csrf token it will populate window.__CSRF
    (function(){
      try{ const token = '{{ csrf_token }}'; if (token && token !== 'None') { window.__CSRF = token; document.getElementById('csrfInput').value = token; } }catch(e){}
    })();

    document.getElementById('login').addEventListener('submit', async function(e){
      e.preventDefault();
      const form = new FormData(this);
      const res = await fetch('/admin/login', {method:'POST', body: form});
      if (res.redirected) {
        window.location = res.url;
        return;
      }
      const contentType = res.headers.get('content-type') || '';
      if (contentType.includes('application/json')) {
        const data = await res.json();
        if (data.ok){ window.location = data.next || '/admin/users'; }
        else { alert(data.message || 'Invalid credentials'); }
      } else if (res.status === 200 || res.status === 302) {
        window.location = next;
      } else {
        alert('Login failed');
      }
    });
  </script>
</body>
</html>
