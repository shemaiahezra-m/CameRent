<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin — Data Sources</title>
  <style>
    body { font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial; padding: 24px; }
    .status { margin: 12px 0; padding: 12px; border-radius: 8px; background:#f3f4f6; }
    button { padding: 10px 14px; border-radius: 8px; border: none; background:#7c3aed; color:white; cursor:pointer; }
    button[disabled]{opacity:0.6}
  </style>
</head>
<body>
  <h1>Data Sources</h1>
  <div id="statuses">
    <div class="status">Checking...</div>
  </div>
  <div style="margin-top:18px">
    <button id="migrateBtn">Migrate users.json → SQLite</button>
  </div>

  <script>
    async function fetchStatus(){
      const res = await fetch('/admin/data-sources.json');
      const data = await res.json();
      const el = document.getElementById('statuses');
      el.innerHTML = '';
      const list = [
        {name: 'users.json', ok: data.hasUsersJson, path: data.usersJsonPath},
        {name: 'SQLite DB (data/app.db)', ok: data.hasSqlite, path: data.sqlitePath}
      ];
      list.forEach(item => {
        const div = document.createElement('div');
        div.className = 'status';
        div.innerHTML = `<strong>${item.name}</strong> — ${item.ok ? 'FOUND' : 'MISSING'}<br><small>${item.path}</small>`;
        el.appendChild(div);
      });
    }

    document.getElementById('migrateBtn').addEventListener('click', async function(){
      this.disabled = true;
      this.textContent = 'Migrating...';
      try{
        const res = await fetch('/admin/migrate-users', { method: 'POST' });
        const data = await res.json();
        alert(data.message || 'Migration complete');
      }catch(e){
        alert('Migration failed')
      }
      this.disabled = false;
      this.textContent = 'Migrate users.json → SQLite';
      fetchStatus();
    });

    fetchStatus();
  </script>
</body>
</html>
