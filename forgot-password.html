<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - CameRent</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-container">
        <!-- Left Side - Form -->
        <div class="auth-form-section">
            <div class="auth-card">
                <!-- Logo -->
                <a href="index.html" class="auth-logo">
                    <i class="fas fa-camera"></i>
                    <span>Came<span class="logo-r">R</span>ent</span>
                </a>

                <!-- Header -->
                <div class="auth-header">
                    <h1>Forgot Password?</h1>
                    <p>No worries! Enter your email and we'll send you reset instructions.</p>
                </div>

                <!-- Forgot Password Form -->
                <form class="auth-form" id="forgotPasswordForm">
                    <div class="form-group">
                        <label for="resetEmail">Email Address</label>
                        <input type="email" id="resetEmail" name="email" required>
                    </div>

                    <button type="submit" class="btn-submit">
                        <span>Send Reset Link</span>
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </form>

                <!-- Footer -->
                <div class="auth-footer">
                    <p>Remember your password? <a href="login.html">Log In</a></p>
                </div>
            </div>
        </div>

        <!-- Right Side - Visual -->
        <div class="auth-visual">
            <div class="visual-content">
                <div class="visual-icon">
                    <i class="fas fa-lock"></i>
                </div>
                <h2>Password Recovery</h2>
                <p>We'll help you get back into your account quickly and securely.</p>
                
                <div class="visual-features">
                    <div class="feature">
                        <i class="fas fa-shield-alt"></i>
                        <span>Secure Process</span>
                    </div>
                    <div class="feature">
                        <i class="fas fa-envelope"></i>
                        <span>Email Verification</span>
                    </div>
                    <div class="feature">
                        <i class="fas fa-clock"></i>
                        <span>Quick Reset</span>
                    </div>
                </div>
            </div>

            <!-- Animated Background Elements -->
            <div class="bg-shapes">
                <div class="shape shape-1"></div>
                <div class="shape shape-2"></div>
                <div class="shape shape-3"></div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('resetEmail').value;
            const submitBtn = this.querySelector('.btn-submit');
            const originalText = submitBtn.innerHTML;
            
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>Sending...</span>';
            submitBtn.disabled = true;
            
            // Simulate API call
            setTimeout(() => {
                showNotification('Password reset link sent to ' + email, 'success');
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
                
                // Redirect to login after 3 seconds
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 3000);
            }, 1500);
        });
    </script>
</body>
</html>
